<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IER">
<meta name="theme-color" content="#211338">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inner Enemy Raid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: handheld JRPG — sticky HUD, stacked dialogue windows, bottom command bar; battles open as a full-screen lane arena. Deliberately single night theme matching the sprite art. */
:root{
  /* purple night + light-green accent */
  --night:#160d26; --night-2:#211338; --star:#3b2760;
  --win:#2b1a4d; --win-hi:#41296f; --win-lo:#1e1237; --win-hl:#5c3f98;
  --frame:#efe6ff; --ink:#0b0616;
  --text:#f7f1ff; --muted:#c4b4e6; --dim:#8b76b9;
  --gold:#c3f08a; --gold-d:#79b84e; --gold-l:#e8ffd0;
  --energy:#7fe3ff; --hp:#ff5c86; --exp:#8ef0c0; --heal:#a6ffb9; --poison:#e08bff;
  --r-n:#c3b9cb; --r-a:#7fbf6a; --r-s:#6f9bc6; --r-f:#d18a35; --r-l:#b880e8;
  --grass:#2e4a35; --grass2:#36583e;
  --shade:rgba(11,6,22,.42);
  --f-px:"Press Start 2P", ui-monospace, monospace;
  --f-th:"Chakra Petch", "Noto Sans Thai", Tahoma, sans-serif;
  --f-num:"VT323", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{font-family:var(--f-th);color:var(--text);font-size:15px;line-height:1.5;background-color:var(--night);background-image:radial-gradient(var(--star) 1.2px,transparent 1.6px);background-size:26px 26px}
body.lock{overflow:hidden}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--night-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img.px,.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.num{font-family:var(--f-num);font-size:1.35em;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tiny{font-size:12.5px}
:focus-visible{outline:3px solid var(--energy);outline-offset:2px}
h3{margin:0;font-size:15px;font-weight:700}
p{margin:0}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--night-2);border-bottom:3px solid var(--frame);box-shadow:0 3px 0 var(--ink)}
.hud-in{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:7px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.logo{font-family:var(--f-px);font-size:11px;line-height:1.3;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.logo small{display:block;font-size:6.5px;color:var(--muted);letter-spacing:.06em;margin-top:3px}
.logo small.sub{font-family:var(--f-th);font-size:9px;font-weight:600;letter-spacing:.02em;color:var(--gold);margin-top:2px}
.hud-stats{display:flex;flex-direction:column;gap:3px;min-width:0}
.hud-row{display:flex;align-items:center;gap:6px;font-size:12px}
.hud-row .bar{flex:1}
.hud-row .num{font-size:17px;min-width:56px;text-align:right}
.lvtag{font-family:var(--f-px);font-size:8px;color:var(--ink);background:var(--exp);padding:3px 4px;border:2px solid var(--ink);white-space:nowrap}
.pair{display:flex;align-items:center;gap:3px}
.hudbtns{display:flex;flex-direction:column;gap:4px}
.codexbtn{font-family:var(--f-th);font-weight:700;font-size:12px;background:var(--win-hi);border:2px solid var(--frame);box-shadow:0 0 0 2px var(--ink);padding:3px 8px;color:var(--text)}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:30px}
.app.solo{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.win{position:relative;background:var(--win);border:3px solid var(--frame);box-shadow:0 0 0 3px var(--ink),7px 7px 0 3px var(--shade);padding:22px 14px 14px;min-width:0}
.wt{position:absolute;top:-15px;left:10px;margin:0;background:var(--ink);color:var(--gold);font:700 13.5px/1 var(--f-th);padding:6px 10px;border:2px solid var(--frame);letter-spacing:.02em;display:flex;align-items:center;gap:5px}
.wt.r{left:auto;right:10px;color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);padding-left:8px;line-height:1.45}
.okmsg{color:var(--exp);font-weight:600}
.badmsg{color:var(--hp);font-weight:600}
.div{border-top:2px dotted var(--win-hl);padding-top:10px}
.btn{font:700 15px/1.2 var(--f-th);color:var(--ink);background:var(--gold);border:3px solid var(--ink);padding:10px 14px;box-shadow:inset -3px -3px 0 var(--gold-d),inset 3px 3px 0 var(--gold-l);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:var(--win-hi);color:var(--text);box-shadow:inset -3px -3px 0 var(--win-lo),inset 3px 3px 0 var(--win-hl)}
.btn.red{background:var(--hp);color:var(--ink);box-shadow:inset -3px -3px 0 var(--shade),inset 3px 3px 0 var(--gold-l)}
.btn.sm{font-size:13px;padding:6px 10px}
.btn.big{width:100%;font-size:17px;padding:13px}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:3px solid var(--ink);background:var(--win-lo)}
.seg button{border:0;background:transparent;padding:9px 4px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--frame);color:var(--ink)}
.seg.sm button{padding:6px 2px;font-size:12px}
.bar{height:14px;background:var(--ink);border:2px solid var(--ink);box-shadow:0 0 0 2px var(--frame);position:relative;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--c,var(--exp));background-image:repeating-linear-gradient(90deg,transparent 0 6px,var(--shade) 6px 8px);transition:width .4s steps(6)}
.bar.thin{height:9px;box-shadow:0 0 0 1px var(--dim)}
.title-hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.title-hero h1{margin:0;font-family:var(--f-px);font-size:22px;line-height:1.3;color:var(--gold);text-shadow:3px 3px 0 var(--ink)}
.title-hero p{color:var(--muted);font-size:13px;max-width:36ch}
.title-hero p.sub{font-family:var(--f-px);font-size:9px;color:var(--gold);letter-spacing:.08em;margin-top:-2px;max-width:none}
.pv{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.stage{background:radial-gradient(ellipse at 50% 88%,var(--win-hi) 0 30%,var(--win-lo) 70%);border:3px solid var(--ink);display:grid;place-items:center;max-width:100%}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls{background:var(--win-lo);border:3px solid var(--win-hl);padding:8px 6px;display:flex;flex-direction:column;gap:6px;text-align:left;align-items:stretch;min-width:0}
.cls.on{border-color:var(--gold);background:var(--win-hi)}
.cls h4{margin:0;font-size:14px;text-align:center}
.cls p{font-size:11.5px;color:var(--muted);line-height:1.35}
.cls .stage{border-width:2px}
.meter{display:grid;grid-template-columns:auto 1fr;gap:3px 5px;align-items:center;font-size:10px;color:var(--muted)}
.meter .bar{height:6px;box-shadow:0 0 0 1px var(--dim)}
@media (max-width:440px){.classes{grid-template-columns:1fr}.cls{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}.cls .stage{grid-row:span 4}.cls h4{text-align:left}}
.hairs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hopt{background:var(--win-lo);border:3px solid var(--win-hl);padding:2px 0;display:grid;place-items:center;min-width:0;overflow:hidden}
.hopt.on{border-color:var(--gold);background:var(--win-hi)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border:3px solid var(--ink);box-shadow:0 0 0 2px var(--win-hl);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--gold)}
.sw.pick{position:relative;cursor:pointer;display:block}
.sw.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.field{width:100%;background:var(--ink);border:2px solid var(--dim);padding:9px 10px;color:var(--text);min-width:0}
.field:focus{border-color:var(--energy);outline:none}
.namefield{font-size:20px;font-weight:700}
.streakbig{display:flex;align-items:center;gap:8px}
.streakbig .num{font-size:44px;color:var(--gold)}
.streakbig small{font-size:12px;color:var(--muted);line-height:1.2}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{background:var(--win-lo);border:2px solid var(--win-hl);display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0 2px;font-size:10.5px;color:var(--dim);min-width:0}
.cal div b{font-family:var(--f-num);font-size:15px;line-height:1;color:var(--muted);font-weight:400}
.cal .ok{border-color:var(--gold);background:var(--win-hi)}
.cal .ok b{color:var(--text)}
.cal .sh{border-color:var(--energy)}
.cal .td{outline:2px dashed var(--gold);outline-offset:1px}
.cal .pre{opacity:.35}
.cal i.dot{display:block;width:6px;height:6px;margin:4px 0;background:var(--win-hl)}
.amtbox{display:flex;align-items:center;gap:8px;background:var(--ink);border:3px solid var(--frame);padding:6px 12px}
.amtbox span{font-family:var(--f-num);font-size:34px;color:var(--gold)}
.amtbox input{flex:1;min-width:0;background:transparent;border:0;font-family:var(--f-num);font-size:40px;line-height:1;color:var(--text);outline:none}
.amtbox:focus-within{border-color:var(--energy)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--win-lo);border:2px solid var(--win-hl);padding:4px 10px;font-family:var(--f-num);font-size:20px;line-height:1}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cat{background:var(--win-lo);border:3px solid var(--win-hl);padding:7px 1px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-width:0;line-height:1.2;text-align:center}
.cat.on{border-color:var(--gold);color:var(--text);background:var(--win-hi)}
.cats.in{grid-template-columns:repeat(4,1fr)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.twocol{grid-template-columns:1fr}}
.entry{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding-block:6px;border-top:2px dotted var(--win-hl)}
.entry .n{font-size:14px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.entry .c{font-size:11.5px;color:var(--muted)}
.entry .a{font-family:var(--f-num);font-size:22px}
.entry .a.in{color:var(--exp)}
.entry .x{background:none;border:0;color:var(--dim);font-size:12px;padding:4px}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gold);padding-top:10px;font-weight:600}
.dayhead:first-child{padding-top:0}
.quest{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding-block:7px;border-top:2px dotted var(--win-hl)}
.quest:first-child{border-top:0}
.quest .rw{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.quest.bonus{border:2px solid var(--gold);padding:8px;margin-top:6px;background:var(--win-lo)}
.done-chip{font-size:12px;color:var(--exp)}
.hpbox{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.mon{display:grid;grid-template-columns:84px 1fr;gap:12px;padding-block:12px;border-top:2px dotted var(--win-hl)}
.mon:first-of-type{border-top:0;padding-top:4px}
.mon .stage{height:84px;width:84px;overflow:hidden}
.mon h3{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.mon .sin{font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.mon .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;font-weight:700;padding:1px 6px;border:2px solid var(--ink);color:var(--ink);background:var(--muted);white-space:nowrap}
.tag.g{background:var(--exp)}.tag.y{background:var(--gold)}.tag.r{background:var(--hp)}.tag.c{background:var(--energy)}.tag.p{background:var(--poison)}.tag.d{background:var(--dim);color:var(--text)}
.boss{border-color:var(--hp)}
.portrait{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.statgrid span{background:var(--win-lo);border:2px solid var(--win-hl);padding:4px 7px;display:flex;flex-direction:column}
.statgrid small{font-size:10.5px;color:var(--muted);letter-spacing:.05em}
.alloc{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding-block:7px;border-top:2px dotted var(--win-hl)}
.arow:first-child{border-top:0}
.arow b{font-family:var(--f-px);font-size:10px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{background:var(--win-lo);border:2px solid var(--win-hl);aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;position:relative;color:var(--text)}
.slot small{font-size:10px;color:var(--muted)}
.skill{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding-block:10px;border-top:2px dotted var(--win-hl)}
.skill:first-of-type{border-top:0}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.pips i{width:8px;height:8px;background:var(--win-hl);display:block}
.pips i.on{background:var(--gold)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border:2px solid var(--win-hl);background:var(--win-lo);color:var(--muted)}
.badge.on{border-color:var(--gold);color:var(--gold)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.item{background:transparent;border:0;aspect-ratio:1;max-width:100%;display:grid;place-items:center;position:relative;padding:0}
.item img{width:100%;height:auto}
.item.unk img{filter:brightness(0);opacity:.55}
.up{position:absolute;top:3px;right:6px;font-family:var(--f-num);font-size:17px;color:var(--gold);text-shadow:1px 1px 0 var(--ink)}
.better{position:absolute;top:3px;left:6px;font-family:var(--f-num);font-size:17px;color:var(--exp);text-shadow:1px 1px 0 var(--ink)}
.eqm{position:absolute;bottom:5px;left:5px;font-size:9.5px;font-weight:700;color:var(--ink);background:var(--gold);padding:0 3px}
.lock{position:absolute;bottom:5px;right:5px;font-size:9.5px;font-weight:700;color:var(--text);background:var(--hp);padding:0 3px}
.p10{filter:drop-shadow(0 0 4px var(--gold))}
.res{display:flex;gap:14px;flex-wrap:wrap}
.res div{display:flex;align-items:center;gap:6px}
.rates{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;font-weight:600}
.gres{grid-template-columns:repeat(5,1fr)}
.pop{animation:pop .35s steps(3) both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.cmpwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmpcol{background:var(--win-lo);border:2px solid var(--win-hl);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.cmpcol.new{border-color:var(--gold)}
.cmpcol small{font-size:11px;color:var(--muted)}
.cmpcol b{font-size:12.5px;line-height:1.3}
.cmptbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.cmptbl td:first-child{width:40%;overflow-wrap:anywhere}
.cmptbl td{padding:4px 6px;border-bottom:1px dotted var(--win-hl)}
.cmptbl td:nth-child(n+2){text-align:right;font-family:var(--f-num);font-size:18px}
.up-g{color:var(--exp)}.dn-r{color:var(--hp)}
.bonus{display:flex;flex-wrap:wrap;gap:6px}
.bonus span{font-size:12px;font-weight:700;padding:1px 6px;border:2px solid var(--rc);color:var(--rc)}
.uptable{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;font-size:11px;text-align:center}
.uptable span{background:var(--win-lo);border:1px solid var(--win-hl);padding:2px 0;color:var(--muted)}
.uptable span.cur{border-color:var(--gold);color:var(--gold)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile2{background:var(--win-lo);border:2px solid var(--win-hl);padding:8px 10px}
.tile2 small{display:block;font-size:12px;color:var(--muted)}
.tile2 .num{font-size:28px}
.cplot{position:relative;height:120px;border-left:2px solid var(--dim);border-bottom:2px solid var(--dim);display:grid;align-items:end;gap:2px;padding-left:2px}
.cplot .b{height:100%;display:flex;align-items:flex-end}
.cplot .b i{display:block;width:100%;background:var(--exp)}
.cplot .b.over i{background:var(--hp)}
.cplot .b.now i{box-shadow:0 0 0 2px var(--gold)}
.bline{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);pointer-events:none}
.bline span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--gold);background:var(--win);padding:0 4px}
.cx{display:grid;gap:2px;font-size:10.5px;color:var(--muted);text-align:center;padding-left:4px}
.catrow{display:grid;grid-template-columns:26px 1fr auto;gap:6px 10px;align-items:center}
.catrow .meta{display:flex;justify-content:space-between;font-size:13px;gap:8px;min-width:0}
.catrow .bar{grid-column:2 / 4}
.catrow input{width:96px}
.duel{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.shadowimg{filter:brightness(0) drop-shadow(0 0 2px var(--poison));opacity:.85}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--night-2);border-top:3px solid var(--frame);box-shadow:0 -3px 0 var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav button{background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.nav button.on{color:var(--gold)}
.nav button.on::before{content:"";position:absolute;top:-3px;left:22%;right:22%;height:4px;background:var(--gold)}
.nav .dotn{position:absolute;top:5px;right:26%;width:8px;height:8px;background:var(--hp);border:2px solid var(--ink)}
.ov{position:fixed;inset:0;z-index:60;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px))}
.ov .win{width:100%;max-width:500px;max-height:100%;overflow:auto}
.result h3{font-family:var(--f-px);font-size:13px;line-height:1.6;color:var(--gold)}
.result.lose h3{color:var(--hp)}
.loot{display:flex;flex-direction:column;gap:5px;font-size:14px}
.loot>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.codex{display:flex;flex-direction:column;gap:18px;font-size:14px;line-height:1.6}
.codex h3{color:var(--gold);font-size:15px}
.codex table{width:100%;border-collapse:collapse;font-size:13px}
.codex td,.codex th{border-bottom:1px dotted var(--win-hl);padding:5px 4px;text-align:left;vertical-align:top}
.codex th{color:var(--muted);font-weight:500;font-size:12px}
.codex td.e{font-family:var(--f-num);font-size:19px;color:var(--energy);white-space:nowrap}
.codex ol,.codex ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tblwrap{overflow-x:auto}
textarea.field{font-family:var(--f-num);font-size:15px;line-height:1.2;min-height:70px;resize:vertical;word-break:break-all}

.toast{background:var(--ink);border:2px solid var(--frame);padding:7px 12px;font-size:13.5px;font-weight:600;max-width:440px;display:flex;gap:6px;align-items:center;box-shadow:4px 4px 0 var(--shade);transition:opacity .3s steps(3),transform .3s steps(3)}

.toast.bad{border-color:var(--hp)}
.toast.out{opacity:0;transform:translateY(-8px)}
.loading{display:grid;place-items:center;min-height:50vh;font-family:var(--f-px);font-size:11px;color:var(--gold)}

.battle{position:fixed;inset:0;z-index:50;background:var(--night);background-image:radial-gradient(var(--star) 1.2px,transparent 1.6px);background-size:26px 26px;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}

.bbox.me{margin-left:20%}

.bbox .spread{font-size:11.5px;color:var(--muted)}
.bchips{display:flex;gap:4px;flex-wrap:wrap;min-height:4px}

.order .o.m img{top:0;width:30px;height:30px}

.tile:nth-child(even){background:var(--grass2)}

@keyframes blink{50%{box-shadow:inset 0 0 0 3px var(--gold-d)}}

.unit.hit img{animation:hit calc(.3s / var(--spd,1)) steps(2)}

.bmsg{background:var(--ink);border:3px solid var(--frame);padding:9px 12px;min-height:46px;font-size:14.5px;line-height:1.45}
.bmsg.hot{color:var(--gold)}
.cmd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmd .btn{width:100%;min-height:52px;flex-direction:column;gap:1px}
.cmd .btn small{font-size:11px;font-weight:600;opacity:.8}
.skl{display:flex;flex-direction:column;gap:6px}
.skl .btn{justify-content:space-between;text-align:left;width:100%}
.skl .btn span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}

.ctl{display:flex;gap:8px;flex-wrap:wrap}

.tog.on{background:var(--energy);box-shadow:inset -3px -3px 0 #3aa6c8,inset 3px 3px 0 #c8f6ff;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6}return[h,s,l]}

async function runBattle(intro){
  const sim=B.sim;await play(intro);
  while(!sim.over&&B.sim===sim){
    const u=sim.next();B.cur=u;B.menu='main';updBattle();
    let ev=sim.startTurn(u);if(ev.length)await play(ev);
    if(!sim.over){
      if(u.side==='m'){await sleep(380);await play(sim.monsterTurn())}
      else if(S.auto){await sleep(260);await autoTurn()}
      else{setMsg(tt(`ตาของ ${esc(S.name)} · เลือกคำสั่ง`,`${esc(S.name)}’s turn · choose`));await new Promise(r=>{B.resolve=r;updBattle()});B.resolve=null}
    }
    if(B.sim!==sim)return;
    sim.endTurn(u);updBattle();
  }
  if(B.sim===sim)finishBattle();
}

      if(e.miss)floatTxt(e.d,'MISS','miss');else{hitFlash(e.d);floatTxt(e.d,(e.crit?'CRIT ':'')+e.dmg,e.crit?'crit':'')}
      updUnits();await sleep(300);break}
    case 'heal':floatTxt(e.who,'+'+e.amt,'heal');if(e.text)setMsg(e.text);updUnits();await sleep(420);break;

function updUnits(){const sim=B.sim;if(!sim||!$('#hb-p'))return;for(const s of['p','m']){const u=s==='p'?sim.P:sim.M,r=u.hp/u.maxhp;const hb=$('#hb-'+s);hb.style.width=r*100+'%';hb.style.setProperty('--c',r>.5?'var(--exp)':r>.2?'var(--gold)':'var(--hp)');$('#ht-'+s).textContent=`${u.hp}/${u.maxhp}`;$('#ch-'+s).innerHTML=chipsOf(u);uel(s).classList.toggle('dead',u.hp<=0)}$('#mb-p').style.width=sim.P.mp/sim.P.maxmp*100+'%';$('#mt-p').textContent=`${sim.P.mp}/${sim.P.maxmp}`}

function finishBattle(){
  const sim=B.sim,m=B.mon,P=sim.P;B.done=true;const lines=[];const win=sim.win&&!sim.fled;const c=D().c;
  c.skill+=sim.stats.skill;c.crit+=sim.stats.crit;c.step+=sim.stats.step;
  setHP(sim.fled?P.hp:win?P.hp:0);
  if(sim.fled){lines.push(tt('หนีออกมาได้ พลังที่ใช้ไปไม่คืน','Escaped; energy not refunded'));c.run=0}
  else if(win){D().won++;c.win++;c.mon[m.id]=(c.mon[m.id]||0)+1;c.run=(c.run||0)+1;c.chain=Math.max(c.chain||0,c.run);if(P.hp/P.maxhp>.5)c.hp50++;if(!B.usedAuto)c.manual++;S.kills[m.id]=(S.kills[m.id]||0)+1;
    let xp=m.exp;if(m.lv<=S.lv-3)xp=Math.round(xp*.5);if(B.feat)xp=Math.round(xp*1.25);const lv0=S.lv;const ups=addExp(xp);
    lines.push(lv0>=LVCAP?tt(`EXP ${xp} → ผลึก (เลเวลตัน)`,`EXP ${xp} → crystals (max level)`):`EXP +${xp}${m.lv<=lv0-3?tt(' (มอนเลเวลต่ำ ลดครึ่ง)',' (low-level monster, halved)'):''}`);
    const cr=1+Math.floor(Math.random()*2)+Math.floor(m.lv/3)+(m.boss?5:0);S.crystals+=cr;lines.push(`${ico('crystal',16)} ${tt('ผลึก','Crystals')} +${cr}`);
    if(m.boss)lines.push(itemLine(rollItem({ref:S.lv})));else if(Math.random()<MONDROP)lines.push(itemLine(rollItem({ref:m.lv,maxRar:2})));
    if(ups)lines.push(lvLine(ups));
  }else{c.run=0;const xp=Math.round(m.exp*.25);const ups=addExp(xp);lines.push(sim.timeout?tt('กิเลสหนีไปได้ (เกินเวลา)','It escaped (time out)'):tt('ล้มลง… เลือดหมด ต้องรอฟื้น','Defeated… wait for HP to recover'));lines.push(tt(`EXP ปลอบใจ +${xp}`,`Consolation EXP +${xp}`));if(ups)lines.push(lvLine(ups))}

    <div class="loot">${lines.map(l=>`<div>${l}</div>`).join('')}</div>
    <p class="tiny muted">${tt('พลัง','Energy')} ${S.energy}/${MAXE} · HP ${hs.hp}/${hs.mx} · ${hpInfo()}</p>
    ${S.repeat&&win&&!rep&&hs.hp/hs.mx<.4?`<p class="tiny badmsg">${tt('ล่าซ้ำหยุด เพราะเลือดต่ำกว่า 40%','Repeat stopped: HP below 40%')}</p>`:''}
    <div class="row"><button class="btn ghost" data-act="bclose">${tt('กลับ','Back')}</button><button class="btn" data-act="bagain" ${again?'':'disabled'}>${rep?tt('ล่าซ้ำใน 2 วิ…','Repeating in 2s…'):tt(`สู้อีก · พลัง ${m.cost}`,`Fight again · ${m.cost}`)}</button>${rep?`<button class="btn ghost" data-act="bstop">${tt('หยุดล่าซ้ำ','Stop repeat')}</button>`:''}${S.potions>0&&hs.hp<hs.mx?`<button class="btn ghost" data-act="potion">${ico('potion',16)} ×${S.potions}</button>`:''}</div></div>`;
  setMsg(win?tt(`${N(m.name)} ถูกสยบ!`,`${N(m.name)} defeated!`):tt('การต่อสู้จบลง','The battle ends'));

}

      <li>${tt('ชนะมอน: โอกาสได้ไอเทม 20% สูงสุด Special · มังกรฟอโม่: ดรอปแน่นอน สุ่มเหมือนกล่องจุ่ม · กล่องจุ่มใช้ตั๋วเท่านั้น','Monster wins: 20% item chance, max Special · FOMO Dragon: guaranteed drop with gacha odds · Gacha uses tickets only')}</li>
    </ul></div>
    <div><h3>${tt('เลือด','HP')}</h3><p>${tt('เลือดไม่รีเซ็ตหลังสู้ ฟื้น 10% ของเลือดสูงสุดทุก 1 นาที (+0.5% ต่อ VIT) เลเวลอัปเลือดเต็ม ยาฟื้นฟูเติม 50%','HP carries over and heals 10% of max per minute (+0.5% per VIT). Level-ups fully heal. Potions restore 50%.')}</p></div>
    <div><h3>${tt('กันโกงโดยไม่เชื่อมธนาคาร','Honesty without bank links')}</h3><ol>
      <li>${tt('รางวัลไม่ขึ้นกับยอดเงิน และจำกัด 3 ครั้ง/วัน วันไม่จ่ายได้เท่ากัน','Rewards ignore amounts and cap at 3/day; no-spend days earn the same')}</li>
      <li>${tt('ตรวจบัญชีรายสัปดาห์: ยอดที่คาดไว้ซ่อนจนกว่าจะกรอกเงินจริง','Weekly check: the expected figure stays hidden until you enter real money')}</li>
      <li>${tt('ศึกเงาเทียบกับค่าเฉลี่ยตัวเอง จดต่ำกว่าจริง เงาสัปดาห์หน้าจะโหดขึ้นเอง','The shadow duel uses your own average; under-reporting makes next week harder')}</li>
    </ol></div>
    <div class="stack"><h3>${tt('เซฟและอัปเดตแพตช์','Saving and patches')}</h3>
      <p class="tiny">${S?(saveOK?`<span class="okmsg">${tt('เซฟอัตโนมัติทุกครั้งที่เล่น','Auto-saves as you play')}</span>`:`<span class="badmsg">${tt('เบราว์เซอร์นี้บล็อกการเซฟ ใช้ไฟล์เซฟแทน','This browser blocks saving; use a save file')}</span>`):''} · ${tt('เวอร์ชันเกม','Game version')} ${GAMEVER}</p>
      <ol class="tiny"><li>${tt('อัปเดตแพตช์: วางไฟล์เกมใหม่ทับไฟล์เดิม (ชื่อเดิม โฟลเดอร์เดิม) แล้วเปิดด้วยเบราว์เซอร์เดิม เซฟจะต่อให้เอง','To patch: replace the old game file with the new one (same name, same folder) and open it in the same browser. Your save carries on.')}</li>
      <li>${tt('กันเหนียว: กด “บันทึกไฟล์เซฟ” ก่อนอัปเดตทุกครั้ง ถ้าเซฟหายให้กด “โหลดไฟล์เซฟ”','To be safe: tap “Download save file” before each patch. If the save is missing, use “Load save file”.')}</li>
      <li>${tt('ย้ายเครื่อง/เปลี่ยนเบราว์เซอร์: ใช้ไฟล์เซฟหรือรหัสสำรอง','Changing device or browser: use the save file or the backup code')}</li></ol>
      ${S?`<p class="tiny muted">${tt('บันทึกไฟล์เซฟล่าสุด','Last save file')}: ${S.lastExport?new Date(S.lastExport).toLocaleString(LANG==='th'?'th-TH':'en-GB'):tt('ยังไม่เคย','never')}</p>
      <div class="row"><button class="btn sm" data-act="dlsave">${tt('บันทึกไฟล์เซฟ','Download save file')}</button></div>`:''}
      <label class="btn sm ghost" style="cursor:pointer">${tt('โหลดไฟล์เซฟ','Load save file')}<input type="file" id="savefile" accept=".json,.txt,application/json" hidden></label>
      ${S?`<textarea class="field" id="savecode" readonly aria-label="backup">${esc(code)}</textarea>
      <button class="btn sm ghost" data-act="copysave">${tt('คัดลอกรหัสสำรอง','Copy backup code')}</button>`:''}
      <textarea class="field" id="importcode" placeholder="${tt('วางรหัสสำรองเพื่อโหลดเซฟ','Paste a backup code to load')}" aria-label="import"></textarea>
      <button class="btn sm ghost" data-act="importsave">${tt('โหลดจากรหัส','Load from code')}</button>
      ${S?`<button class="btn sm red" data-act="delchar">${tt('ลบตัวละครและเริ่มใหม่','Delete hero and restart')}</button>`:''}</div>
    <button class="btn ghost" data-act="closeov">${tt('ปิด','Close')}</button>
  </div></div>`;
}

/* ---------- render ---------- */
let READY=false;
function render(){
  hud();if(!READY)return;nav();const app=$('#app');
  if(!S){app.classList.add('solo');app.innerHTML=vCreate();return}
  app.classList.remove('solo');
  app.innerHTML={ledger:vLedger,hunt:vHunt,hero:vHero,bag:vBag,stats:vStats}[ui.view]();
}
function closeOv(){const ov=$('#ov');ov.hidden=true;ov.innerHTML='';ui.delArm=false;ui.impArm=false;render()}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v,id=+b.dataset.id;
  if(a!=='statreset')ui.resetArm=false;
  switch(a){
    case 'lang':LANG=LANG==='th'?'en':'th';try{localStorage.setItem('ier-lang',LANG)}catch(e){}if(S){S.lang=LANG;save()}if(!$('#ov').hidden)closeOv();else render();if(B.sim&&!$('#battle').hidden)updBattle();break;
    case 'crcls':cr.cls=v;cr.arm=false;render();break;
    case 'crhair':cr.hair=+v;cr.arm=false;render();break;
    case 'crhc':cr.hc=+v;cr.arm=false;render();break;
    case 'creye':cr.eye=v;cr.arm=false;render();break;
    case 'crskin':cr.skin=+v;cr.arm=false;render();break;
    case 'crattack':previewAttack();break;
    case 'create':createChar();break;
    case 'view':ui.view=v;render();window.scrollTo(0,0);break;
    case 'bagslot':ui.view='bag';ui.bagF=v;render();window.scrollTo(0,0);break;
    case 'codex':openCodex();break;
    case 'closeov':closeOv();break;
    case 'ltype':ui.type=v;render();break;
    case 'lcat':ui.cat[ui.type]=v;document.querySelectorAll('.cat').forEach(c=>c.classList.toggle('on',c.dataset.v===v));break;
    case 'lday':ui.back=v==='1';render();break;
    case 'qamt':{const c=parseFloat(ui.amt)||0;ui.amt=v==='0'?'':String(c+ +v);$('#amt').value=ui.amt;break}
    case 'save':addEntry();break;
    case 'pick':pickCard(+v);break;
    case 'cardnext':cardNext();break;
    case 'del':S.entries=S.entries.filter(e=>e.id!==id);save();render();toast(tt('ลบแล้ว รางวัลที่รับไปไม่คืนช่อง','Deleted; used reward slots stay used'));break;
    case 'resist':doResist();break;
    case 'closeprep':closePrep(v);break;
    case 'closeday':closeDay(v);break;
    case 'nospend':if($('#nscheck')&&$('#nscheck').checked)confirmNoSpend();break;
    case 'claim':claimQuest(+v);break;
    case 'bonus':claimBonus();break;
    case 'potion':drinkPotion();if(B.done&&!$('#battle').hidden)finishBattleRefresh();break;
    case 'fight':startBattle(b.dataset.id);break;
    case 'tile':playerMove(+v);break;
    case 'batk':playerAct({type:'attack'});break;
    case 'bwait':playerAct({type:'wait'});break;
    case 'bskill':playerAct({type:'skill',id:v});break;
    case 'bmenu':B.menu=v;updBattle();break;
    case 'bflee':if(B.resolve&&!B.busy){B.sim.over=true;B.sim.fled=true;B.resolve()}break;
    case 'bauto':toggleAuto();break;
    case 'bspeed':S.speed=S.speed>=3?1:(S.speed||1)+1;save();$('#battle').style.setProperty('--spd',S.speed);updBattle();break;
    case 'brepeat':S.repeat=!S.repeat;save();updBattle();break;
    case 'bclose':closeBattle();break;
    case 'bagain':startBattle(B.mon.id);break;
    case 'bstop':clearTimeout(B.rep);S.repeat=false;save();finishBattleRefresh();break;
    case 'stat':if(S.pts<1)return;{const before=curStats().maxhp;S.pts--;S.stats[v]++;const after=curStats().maxhp;if(S.hp!=null&&after>before)S.hp+=after-before}save();render();break;
    case 'statreset':{if(!ui.resetArm){ui.resetArm=true;render();return}if(S.crystals<10){toast(tt('ผลึกไม่พอ','Not enough crystals'),'bad');ui.resetArm=false;render();return}const st=CLASSES[S.cls].start;let spent=0;for(const k of STATK)spent+=S.stats[k]-st[k];S.stats={...st};S.pts+=spent;S.crystals-=10;ui.resetArm=false;save();render();toast(tt(`คืนแต้ม ${spent} แต้มแล้ว`,`Refunded ${spent} points`),'gold');break}
    case 'learn':{const sk=SKILLS[S.cls].find(s=>s.id===v);if(S.sp<1||S.lv<sk.unlock||S.skills[v]>=5)return;S.sp--;S.skills[v]++;save();render();toast(`${N(sk.name)} Lv${S.skills[v]}`,'gold');break}
    case 'title':S.title=v;save();render();break;
    case 'chest':openChest();break;
    case 'pull':pull(+v);break;
    case 'bagf':ui.bagF=v;render();break;
    case 'dexf':ui.dexF=v;render();break;
    case 'dex':openDex(v);break;
    case 'item':openItem(id);break;
    case 'equip':{const it=S.inv.find(i=>i.id===id);if(!canWear(it))return;S.eq[it.slot]=id;bump('equip');save();openItem(id);render();break}
    case 'unequip':{const it=S.inv.find(i=>i.id===id);if(it.slot==='weapon'){toast(tt('ต้องมีอาวุธ 1 ชิ้น สวมชิ้นอื่นแทนได้','You need a weapon; equip another instead'),'bad');return}S.eq[it.slot]=null;bump('equip');save();openItem(id);render();break}
    case 'upgrade':{const it=S.inv.find(i=>i.id===id);const c=upCost(it.up);if(S.crystals<c||it.up>=10)return;S.crystals-=c;bump('up');if(Math.random()<UPR[it.up]){it.up++;toast(tt(`ตีบวกสำเร็จ! +${it.up}`,`Upgrade success! +${it.up}`),'gold')}else if(it.up>=5){it.up--;toast(tt(`ตีไม่ติด ลดเหลือ +${it.up}`,`Failed, dropped to +${it.up}`),'bad')}else toast(tt('ตีไม่ติด เสียผลึก ขั้นไม่ลด','Failed; level kept'),'bad');save();openItem(id);render();break}
    case 'salvage':{const it=S.inv.find(i=>i.id===id);const g=(it.rar+1)*3+it.up*2+Math.floor(it.lv/2);S.inv=S.inv.filter(i=>i.id!==id);S.crystals+=g;toast(`${ico('crystal',16)} +${g}`,'gold');save();closeOv();break}
    case 'smode':ui.stats=v;render();break;
    case 'budget':if(ui.budgetEdit){document.querySelectorAll('[data-budget]').forEach(i=>{const n=parseFloat(i.value);if(n>=0)S.budget[i.dataset.budget]=Math.round(n)});save();toast(tt('บันทึกงบแล้ว','Budget saved'),'gold')}ui.budgetEdit=!ui.budgetEdit;render();break;
    case 'recon':doRecon();break;
    case 'setopen':{const n=parseFloat(String($('#openv').value).replace(/,/g,''));if(!(n>=0)){toast(tt('ใส่ยอดเงินตั้งต้น','Enter a starting balance'),'bad');return}S.opening=n-S.entries.reduce((s,e)=>s+(e.type==='in'?e.amt:-e.amt),0);save();render();toast(tt('ตั้งยอดแล้ว','Balance set'),'gold');break}
    case 'review':doReview();break;
    case 'duelset':setDuel();break;
    case 'duelclaim':claimDuel(v);break;
    case 'copysave':{const ta=$('#savecode');const txt=ta.value;const fb=()=>{ta.select();toast(tt('เลือกข้อความแล้ว กดคัดลอกเอง','Text selected; copy it manually'))};navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt).then(()=>toast(tt('คัดลอกแล้ว','Copied'),'gold')).catch(fb):fb();break}
    case 'importsave':{const txt=$('#importcode').value.trim();if(!txt){toast(tt('วางรหัสก่อน','Paste a code first'),'bad');return}const s=parseSave(txt);if(!s){toast(tt('รหัสไม่ถูกต้อง','Invalid code'),'bad');return}if(S&&!ui.impArm){ui.impArm=true;b.textContent=tt('กดอีกครั้ง เซฟปัจจุบันจะถูกแทนที่','Tap again: current save will be replaced');return}applyLoaded(s);break}
    case 'dlsave':downloadSave();break;
    case 'delchar':if(!ui.delArm){ui.delArm=true;b.textContent=tt('กดอีกครั้งเพื่อลบถาวร','Tap again to delete forever');return}try{localStorage.removeItem(KEY);localStorage.removeItem(BAKKEY);OLDKEYS.forEach(k=>localStorage.removeItem(k))}catch(e){}S=null;ui.delArm=false;Object.assign(cr,{name:'',cls:'greatsword',hair:1,hc:1,skin:2,eye:EYE0,arm:false});closeOv();window.scrollTo(0,0);break;
  }
});
function applyLoaded(s){S=s;if(S.lang)LANG=S.lang;CARRY=null;save();ui.impArm=false;URLC.clear();closeOv();settle();settleMonth();D();render();toast(tt(`โหลดเซฟของ ${esc(S.name)} แล้ว`,`Loaded ${esc(S.name)}`),'gold')}
function finishBattleRefresh(){const hs=hpState();const btn=document.querySelector('[data-act="bagain"]');if(btn){btn.textContent=tt(`สู้อีก · พลัง ${B.mon.cost}`,`Fight again · ${B.mon.cost}`);btn.disabled=!(S.energy>=B.mon.cost&&hs.hp>=1)}const st=document.querySelector('[data-act="bstop"]');if(st)st.remove();const pb=document.querySelector('#b-cmd [data-act="potion"]');if(pb&&(S.potions<1||hs.hp>=hs.mx))pb.remove();else if(pb)pb.innerHTML=`${ico('potion',16)} ×${S.potions}`}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='amt')ui.amt=t.value;else if(t.id==='note')ui.note=t.value;else if(t.id==='ritem')ui.rItem=t.value;else if(t.id==='ramt')ui.rAmt=t.value;
  else if(t.id==='crname'){cr.name=t.value;cr.arm=false;const btn=document.querySelector('[data-act="create"]');if(btn){btn.classList.remove('red');btn.textContent=tt('สร้างตัวละคร','Create hero')}}
  else if(t.id==='duelamt')ui.duelAmt=t.value;
  else if(t.id==='nscheck'){const nb=$('#nsbtn');if(nb)nb.disabled=!t.checked}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='savefile'&&t.files&&t.files[0]){const f=t.files[0];const r=new FileReader();r.onload=()=>{const s=parseSave(r.result);if(!s){toast(tt('ไฟล์เซฟไม่ถูกต้อง','Not a valid save file'),'bad');return}applyLoaded(s)};r.readAsText(f);t.value='';return}if(t.id==='hcpick'){cr.hc=t.value.toLowerCase();cr.arm=false;render();return}if(t.id==='eyepick'){cr.eye=t.value.toLowerCase();cr.arm=false;render();return}if(t.id==='rcat')ui.rCat=t.value;if(t.id==='duelcat'){ui.duelCat=t.value;render()}if(t.id==='duelamt')render();if(t.id==='nscheck'){const nb=$('#nsbtn');if(nb)nb.disabled=!t.checked}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='amt'||e.target.id==='note')){e.preventDefault();addEntry()}if(e.key==='Escape'&&!$('#ov').hidden&&!ui.cq)closeOv()});
function toast(msg,kind){const el=document.createElement('div');el.className='toast '+(kind||'');el.innerHTML=msg;$('#toasts').appendChild(el);setTimeout(()=>el.classList.add('out'),2600);setTimeout(()=>el.remove(),3000)}
setInterval(()=>{if(!S||!READY)return;hud();const el=$('#hpinfo');if(el){const hs=hpState();el.innerHTML=`HP <b class="num">${hs.hp}/${hs.mx}</b> · ${hpInfo()}`}},1000);

hud();
ATLAS.onload=()=>{READY=true;if(S){settle();settleMonth();D()}render()};
ATLAS.onerror=()=>{$('#app').innerHTML=`<div class="loading">${tt('โหลดภาพตัวละครไม่สำเร็จ ลองรีเฟรช','Could not load the sprites. Try refreshing.')}</div>`};
ATLAS.src=ATLAS_URL;
</script>

<div id="pwabar" hidden style="position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;justify-content:center;padding:0 12px;pointer-events:none"><div style="pointer-events:auto;max-width:480px;width:100%;background:var(--ink);border:3px solid var(--gold);box-shadow:0 0 0 3px var(--ink);padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13.5px"><span id="pwamsg" style="flex:1"></span><button class="btn sm" id="pwabtn"></button><button class="btn sm ghost" id="pwax" aria-label="close">✕</button></div></div>
<script>
(function(){
  const bar=document.getElementById('pwabar'),msg=document.getElementById('pwamsg'),btn=document.getElementById('pwabtn');
  const show=(m,b,fn)=>{msg.innerHTML=m;btn.textContent=b;btn.hidden=!b;btn.onclick=fn;bar.hidden=false};
  document.getElementById('pwax').onclick=()=>{bar.hidden=true;try{localStorage.setItem('ier-hint-off',Date.now())}catch(e){}};
  const t=(th,en)=>(typeof LANG!=='undefined'&&LANG==='en')?en:th;
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  const standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let off=0;try{off=+localStorage.getItem('ier-hint-off')||0}catch(e){}
  if(ios&&!standalone&&Date.now()-off>864e5)show(t('ติดตั้งก่อนเล่น: กดปุ่มแชร์ <b>⬆︎</b> แล้วเลือก <b>“เพิ่มไปยังหน้าจอโฮม”</b> จากนั้นเปิดเกมจากไอคอน IER เพื่อเล่นออฟไลน์และให้เซฟอยู่ถาวร','Install first: tap Share <b>⬆︎</b> → <b>“Add to Home Screen”</b>, then open IER from its icon to play offline with a permanent save'),'',null);
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const offer=w=>show(t('มีแพตช์ใหม่พร้อมแล้ว เซฟเดิมยังอยู่ครบ','A new patch is ready. Your save stays.'),t('อัปเดตเลย','Update now'),()=>{w.postMessage('skip')});
    if(reg.waiting)offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)offer(w)})});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()});
})();
</script>
